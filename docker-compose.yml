services:

  web:
    build: .
    container_name: adaptation_app
    command: gunicorn almau_adaptation.wsgi:application --bind 0.0.0.0:8000 --workers=4
    volumes:
      # - .:/app     
      - static_volume:/app/staticfiles
      - /srv/adaptation/media:/app/media   # ✅ добавляем постоянное хранилище
      # - media_volume:/app/media
      # - ./static:/app/staticfiles     # 👈 локальная папка static
      # - ./media:/app/media   
    env_file:
      - .env
    ports:
      - "8000:8000"

  celery:
    build: .
    container_name: adaptation_celery
    command: celery -A almau_adaptation worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - web
    restart: always

  celery_beat:
    build: .
    container_name: adaptation_celery_beat
    command: celery -A almau_adaptation beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - web
    restart: always

  redis:
    image: redis:7.2-alpine
    container_name: adaptation_redis
    restart: always
    ports:
      - "6379:6379"
  
  nginx:
    image: nginx:stable
    container_name: adaptation_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles
      - /srv/adaptation/media:/app/media
    depends_on:
      - web


volumes:
  static_volume:
  media_volume:
